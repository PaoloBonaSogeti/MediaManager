<main class="page">
  <section class="panel">
    <header class="panel-header">
      <h1>{{ title() }}</h1>
      <p>Manage media types and media items using the backend API.</p>
    </header>

    <nav class="tabs" aria-label="CRUD pages">
      <a
        routerLink="/media-types"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Media Types
      </a>
      <a routerLink="/media-items" routerLinkActive="active">Media Items</a>
    </nav>

    <section class="content">
      <router-outlet></router-outlet>
    </section>
  </section>
</main>
